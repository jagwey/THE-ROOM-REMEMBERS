<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="presentation">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#493f51" stop-opacity="0"/>
      <stop offset="35%" stop-color="#695575" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#c93b4f" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#695575" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#493f51" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes dPulse {
        0%, 100% { opacity: 0.7; }
        50%      { opacity: 1; }
      }
      .dp { animation: dPulse 3.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="20" y="13.2" width="960" height="1.6" fill="url(#dl)"/>
  <g class="dp">
    <polygon points="500.0,6.0 508.0,14.0 500.0,22.0 492.0,14.0" fill="#221b27" stroke="#d94b5e" stroke-width="1.5"/>
    <polygon points="500.0,10.5 503.5,14.0 500.0,17.5 496.5,14.0" fill="#e86a7b"/>
    <circle cx="478.0" cy="14.0" r="2" fill="#8c3243"/>
    <circle cx="522.0" cy="14.0" r="2" fill="#8c3243"/>
  </g>
</svg>
